# Konfiguration fuer python-semantic-release.
# Single Source der Version ist karteikarten/__init__.py:__version__.
# Release laeuft lokal ueber `make release` (Actions sind aus, INFRA-267); live
# bringt es infrastruktur/scripts/ship.sh.
# Version NIEMALS manuell bumpen — semantic-release leitet sie aus Conventional Commits ab.

[tool.semantic_release]
version_variables = ["karteikarten/__init__.py:__version__"]
upload_to_pypi = false
build_command = ""
tag_format = "v{version}"
commit_message = "chore(release): {version} [skip ci]"
major_on_zero = false

# **Seit v9 steht der Zweig in einer eigenen Gruppe.** Ein `branch = "main"` auf
# oberster Ebene (stand hier bis KK-10) ist in v10 ein unbekannter Schluessel und
# wird ignoriert; gegriffen hat bisher nur die Vorgabe des Werkzeugs.
[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
default_templates = { changelog_file = "CHANGELOG.md" }
# Neue Versionen landen hinter dieser Marke in CHANGELOG.md. Fehlt sie dort,
# schreibt semantic-release wortlos nichts.
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "refactor", "perf", "docs", "style", "test", "chore", "ci", "build"]
minor_tags = ["feat"]
patch_tags = ["fix", "refactor", "perf"]

[tool.semantic_release.remote]
type = "github"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint]
# Regelsatz explizit statt implizit: ruff 0.16 aktiviert deutlich mehr Default-Regeln
# als 0.15 (RUF012, DTZ, BLE, EXE ... — 150 Treffer im Bestand). Fuer ein Bastelprojekt
# ist ein Regel-Sprung dieser Groesse kein Gewinn; die bisher geltenden Regeln werden
# hier festgeschrieben, damit Lint-Verhalten nicht mehr an der ruff-Version haengt.
# Erweiterung jederzeit moeglich — dann bewusst und mit Aufraeumen in einem eigenen PR.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Django-Seed-Skripte muessen django.setup() ausfuehren, BEVOR sie Models importieren —
# ein Import am Dateianfang wuerde mit ImproperlyConfigured abbrechen. E402 ist hier
# also kein Maengel, sondern die einzige funktionierende Reihenfolge.
"scripts/seed_*.py" = ["E402"]
