# Pre-commit-Hooks.
#
# Zwei Stufen mit unterschiedlichem Tempo: beim **Commit** laufen nur schnelle
# Autofixes, beim **Push** das volle Gate `make check`. So bleiben Commits
# fluessig, und trotzdem verlaesst nichts Ungeprueftes den Rechner.
#
# Das ist seit dem 12.08.2026 die einzige automatische Pruefung: GitHub hat die
# Actions wegen einer fehlgeschlagenen Zahlung gestoppt. Der letzte CI-Lauf in
# diesem Repo liegt entsprechend zurueck — ohne diesen Hook liefe hier gar kein
# Test mehr.
#
# Installieren:  pre-commit install --hook-type pre-commit --hook-type pre-push
# Umgehen:       git push --no-verify   (nur mit gutem Grund)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  # **Secret-Scan als Hook, nicht nur als Action.** Die Actions dieser Flotte
  # sind bis September 2026 abgeschaltet — ein Scan, der nur dort laeuft, laeuft
  # gar nicht. Am 25.08.2026 ist deshalb eine `.env`-Sicherungskopie mit
  # OIDC-Secret und API-Token in einen Commit gelangt, an sechs bestandenen
  # Hooks vorbei.
  #
  # Der Hook prueft die *bereitgestellten* Aenderungen, nicht die Historie.
  # Einen Fund raeumt man nicht mit `--no-verify` weg: Der Zugang gilt ab dem
  # Moment als offengelegt und muss gewechselt werden.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # **Der Hook nimmt das ruff aus dem venv** — dasselbe, das `make lint` aufruft.
  #
  # Bis zum 11.11.2026 stand hier `repo: astral-sh/ruff-pre-commit` mit eigener
  # `rev` (0.16.8), waehrend `requirements-dev.txt` auf 0.17.3 steht: zwei
  # Quellen fuer dieselbe Zahl, die Schere aus INFRA-330/INFRA-415. Mit
  # `language: system` gibt es nur noch den Pin.
  # Setzt voraus, dass `make setup` gelaufen ist.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check (venv)
        entry: .venv/bin/python -m ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format (venv)
        entry: .venv/bin/python -m ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: local
    hooks:
      - id: make-check
        name: make check (Django-Checks + Lint + Tests)
        entry: make dod
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
