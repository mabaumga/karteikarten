# Secret-Scan (gitleaks) — stack-agnostische CI-Vorlage.
# Vendoren nach .github/workflows/secret-scan.yml. Setzt durch: keine Secrets/Tokens/Credentials
# im Repo. Schlaegt der Scan an, scheitert PR/Push.
#
# WICHTIG (sonst scheitert JEDER PR — nicht wegen Funden):
#   - env.GITHUB_TOKEN ist ab gitleaks-action v2 fuer PR-Scans Pflicht.
#   - Job-permissions contents:read + pull-requests:write, sonst HTTP 403
#     "Resource not accessible by integration" beim Lesen/Kommentieren des PR.

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
