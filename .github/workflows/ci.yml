name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Quality-Gate (Django-Checks + Lint + Tests)
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-secret-key-not-for-production
        run: make dod

  automerge:
    name: Dependabot zusammenfuehren
    # An den Sammel-Job, nicht an die Teststufe: `quality-gate` haengt an allen
    # anderen. Wer nur die Tests nennt, merged einen PR, dessen Image-Rauchtest
    # gescheitert ist.
    needs: quality-gate
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    # Der voreingestellte Token ist bei Dependabot-PRs nur lesend. Diese beiden
    # Rechte hebt der Block wieder an — mehr *kann* er nicht anheben, siehe die
    # Actions-Regel unten.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Was fuer ein Update ist das?
        id: art
        uses: dependabot/fetch-metadata@v2

      # **Eine Entscheidung, zwei Ausgaenge — und keine Luecke dazwischen.**
      # Vorher stand hier eine Kette von `if:`-Bedingungen an den Schritten.
      # Sie hatte ein Loch: Bei einem PR der Form "update requirement from
      # >=1.0.0 to >=1.2.3" verschiebt Dependabot nur eine Untergrenze, es gibt
      # also kein "von A auf B" — `update-type` ist dann **null**. Ein solcher
      # PR traf keine der Bedingungen, wurde weder zusammengefuehrt noch
      # kommentiert und blieb wortlos liegen. Genau das sieht aus wie ein
      # Fehler, ohne einer zu sein.
      #
      # Mit `else` faellt nichts mehr durch: Jeder PR landet in genau einem der
      # beiden Ausgaenge, und wer nicht gemerged wird, erfaehrt warum.
      - name: Entscheiden
        id: regel
        env:
          OEKO: ${{ steps.art.outputs.package-ecosystem }}
          ART: ${{ steps.art.outputs.update-type }}
          TYP: ${{ steps.art.outputs.dependency-type }}
          NAMEN: ${{ steps.art.outputs.dependency-names }}
        run: |
          if [ "$OEKO" = "github_actions" ]; then
            # Ein Action-Bump aendert diese Datei hier, und das darf
            # GITHUB_TOKEN nicht: "refusing to allow a GitHub App to create or
            # update workflow ... without `workflows` permission". Die
            # Berechtigung laesst sich fuer das voreingestellte Token gar nicht
            # vergeben; es gaebe sie nur ueber einen eigenen PAT mit
            # `workflow`-Recht, der flottenweit Workflows schreiben duerfte.
            echo "merge=nein" >> "$GITHUB_OUTPUT"
            echo "grund=Der PR aendert eine Workflow-Datei, und das darf GITHUB_TOKEN nicht. Die CI ist gruen — bitte von Hand mergen." >> "$GITHUB_OUTPUT"
          elif [ "$ART" = "version-update:semver-patch" ] || [ "$ART" = "version-update:semver-minor" ]; then
            echo "merge=ja" >> "$GITHUB_OUTPUT"
          elif [ "$TYP" = "direct:development" ]; then
            # Bricht pytest 9 oder ruff 0.17, wird genau dieser Lauf rot — dann
            # merged der Job ohnehin nicht. Hier sagt die CI etwas.
            echo "merge=ja" >> "$GITHUB_OUTPUT"
          else
            # Laufzeit-Abhaengigkeit, deren Sprung die CI nicht beurteilen
            # kann: Sie faehrt die Tests gegen das Runner-Python und startet
            # keinen Server. Am 06.09.2026 lagen in fuenf Repos zehn
            # Dependabot-PRs mit gruener CI vor, darunter
            # `python:3.12-slim -> 3.14-slim` und `gunicorn 23 -> 26`.
            echo "merge=nein" >> "$GITHUB_OUTPUT"
            echo "grund=Laufzeit-Abhaengigkeit ($NAMEN, update-type=${ART:-unbestimmt}). Die CI startet keinen Server — ihr gruenes Haeckchen sagt hier wenig. Bitte von Hand pruefen." >> "$GITHUB_OUTPUT"
          fi

      - name: Zusammenfuehren
        if: steps.regel.outputs.merge == 'ja'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Liegen lassen und sagen, warum
        if: steps.regel.outputs.merge == 'nein'
        # Block-Skalar, kein Einzeiler: Das ": " im Text laese YAML sonst als
        # Mapping — "mapping values are not allowed here".
        run: |
          gh pr comment "$PR_URL" --body "Nicht automatisch zusammengefuehrt: $GRUND"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GRUND: ${{ steps.regel.outputs.grund }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
