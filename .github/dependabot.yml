# Dependabot — GitHub-nativer Dependency-Fluss (Standards-Review 2026-08 §9).
# Ersetzt den selbstgebauten dependency-check.yml-Workflow. Kein Auto-Merge.
# Gruppierung: minor/patch gebuendelt (klein + mergebar), MAJOR einzeln —
# ein Sammel-PR ueber alle Updates scheitert an ResolutionImpossible.

version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-deps-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
