# Dependabot — GitHub-nativer Dependency-Fluss (Standards-Review 2026-08 §9).
# Ersetzt den selbstgebauten dependency-check.yml-Workflow.
# Auto-Merge entscheidet der Job `automerge` in ci.yml, nicht diese Datei.
# Gruppierung: minor/patch gebuendelt (klein + mergebar), MAJOR einzeln —
# ein Sammel-PR ueber alle Updates scheitert an ResolutionImpossible.

version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      # Monatlich statt woechentlich seit 16.09.2026 (INFRA-269, Massnahme 4):
      # 282 Dependabot-PR-Laeufe im September waren rund 70 % aller PR-Minuten.
      # Betrifft nur Versions-Updates. **Security-Updates kommen weiter sofort** —
      # die haengen am Repo-Schalter, nicht an diesem `interval`.
      interval: monthly
    ignore:
      # GitPython bewusst zurueckgehalten. python-semantic-release 10.6.1 liest
      # `git.Actor.name_email_regex`; GitPython hat das Attribut in 3.1.59
      # entfernt, `semantic-release version` bricht danach schon beim Laden der
      # Config ab. 10.6.1 ist die neueste PSR-Version -- es gibt kein Update, auf
      # das man warten koennte. Der Pin in requirements-release.txt IST der Fix,
      # kein veralteter Zopf. Ohne diese Sperre schlaegt Dependabot ihn monatlich
      # zur Anhebung vor; wer zugreift, legt das Release lahm.
      - dependency-name: GitPython
    groups:
      python-deps-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
